
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>منصة التذوق الأدبي | جامعة المنصورة الجديدة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #000000; 
        color: #FFFFFF;
        transition: background-color 0.5s ease;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      
      /* Desktop Specific Optimizations */
      @media (min-width: 1024px) {
        .desktop-max-width {
          max-width: 1440px !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
        .hero-title-scale {
          /* تقليل الحد الأقصى قليلاً وزيادة ارتفاع السطر لمنع التداخل */
          font-size: clamp(2.5rem, 5vw, 5.5rem) !important;
          line-height: 1.4 !important; 
          letter-spacing: -0.02em;
        }
      }

      /* Gold Gradient Text */
      .text-gold-gradient {
        background: linear-gradient(to bottom, #FFD700 0%, #D4AF37 50%, #B8860B 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Gold Glow Effects */
      .gold-glow {
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
      }
      .gold-border {
        border: 1px solid rgba(212, 175, 55, 0.3);
      }

      @keyframes shimmer {
        0% { background-position: 0 0; }
        100% { background-position: 40px 0; }
      }
      .animate-shimmer {
        animation: shimmer 1.5s linear infinite;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.6s ease-out forwards;
      }

      @keyframes slide-up {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slide-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scale-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body { background-color: white !important; color: black !important; }
      }
      .print-only {
        display: none;
      }

      /* Premium Scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #D4AF37, #B8860B);
        border-radius: 10px;
      }

      /* No Scrollbar helper */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      ::selection {
        background-color: #D4AF37;
        color: #000;
      }
      
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* Card Glass Effect */
      .glass-card {
        background: rgba(20, 20, 20, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.15);
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {

              gold: {
                50: '#FFFBEB',
                100: '#FEF3C7',
                200: '#FDE68A',
                300: '#FCD34D',
                400: '#FBBF24',
                500: '#D4AF37', // Primary Gold
                600: '#B8860B', // Deep Gold
                700: '#926A09',
                800: '#785708',
                900: '#453205',
              },
              dark: {
                900: '#000000',
                800: '#0A0A0A',
                700: '#141414',
                600: '#1F1F1F',
              }
            },
            borderRadius: {
              '4xl': '2rem',
              '5xl': '2.5rem',
            }
          }
        }
      }
    </script>
