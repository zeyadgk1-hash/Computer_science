    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mathematics II | جامعة المنصورة الجديدة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for LaTeX Support -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #F9FAFB;
        color: #111827;
        transition: background-color 0.5s ease;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      
      @media (min-width: 1024px) {
        .desktop-max-width {
          max-width: 1440px !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
        .hero-title-scale {
          font-size: clamp(2.5rem, 5vw, 5.5rem) !important;
          line-height: 1.4 !important; 
          letter-spacing: -0.02em;
        }
      }

      .text-math-gradient {
        background: linear-gradient(to bottom, #3B82F6 0%, #1E40AF 50%, #1E3A8A 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .math-glow {
        box-shadow: 0 10px 40px rgba(37, 99, 235, 0.1);
      }

      @keyframes slide-up {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slide-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.6s ease-out forwards;
      }

      @media print {
        .no-print { display: none !important; }
        body { background-color: white !important; color: black !important; }
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #F3F4F6; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #2563EB, #1E3A8A);
        border-radius: 10px;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      ::selection { background-color: #2563EB; color: #fff; }
      * { -webkit-tap-highlight-color: transparent; }

      /* Math Overrides for better visibility */
      .mjx-chtml { font-size: 110% !important; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              math: {
                50: '#EFF6FF',
                100: '#DBEAFE',
                200: '#BFDBFE',
                300: '#93C5FD',
                400: '#60A5FA',
                500: '#2563EB', // Primary Math Blue
                600: '#1D4ED8',
                700: '#1E40AF',
                800: '#1E3A8A',
                900: '#172554',
              }
            }
          }
        }
      }
    </script>
