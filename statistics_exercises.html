    <meta charset="UTF-8" />

    <title>Statistics | جامعة المنصورة الجديدة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for LaTeX Support -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        transition: background-color 0.5s ease;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      
      @media (min-width: 1024px) {
        .desktop-max-width {
          max-width: 1440px !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
        .hero-title-scale {
          font-size: clamp(2.5rem, 5vw, 5.5rem) !important;
          line-height: 1.2 !important; 
          letter-spacing: -0.02em;
        }
      }

      .text-stats-gradient {
        background: linear-gradient(to bottom, #6366F1 0%, #4338CA 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .stats-glow {
        box-shadow: 0 10px 40px rgba(99, 102, 241, 0.15);
      }

      @keyframes slide-up {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slide-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.6s ease-out forwards;
      }

      @media print {
        .no-print { display: none !important; }
        body { background-color: white !important; color: black !important; }
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #F1F5F9; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #6366F1, #4338CA);
        border-radius: 10px;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      ::selection { background-color: #6366F1; color: #fff; }
      * { -webkit-tap-highlight-color: transparent; }

      .mjx-chtml { font-size: 110% !important; }
    </style>

      tailwind.config = {

                400: '#818CF8',

                600: '#4F46E5',

                900: '#312E81',

            }
          }
        }
      }
    </script>
