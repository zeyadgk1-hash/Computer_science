    <title>Introduction to Management | جامعة المنصورة الجديدة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- KaTeX Core Library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
      :root {
        --brand-primary: #9b111e;
        --brand-dark: #7a0d17;
        --bg-light: #fff1f2;
      }
      body {
        font-family: 'Cairo', sans-serif;
        background-color: var(--bg-light);
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        overflow-y: auto;
      }
      
      .btn-management {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-weight: 700;
        border-radius: 0.75rem;
      }
      
      .btn-management:active {
        transform: scale(0.98);
      }

      .q-square {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border-radius: 12px;
        transition: all 0.2s ease;
        cursor: pointer;
        font-size: 1.1rem;
        border: 2px solid #e2e8f0;
        background: white;
        color: #64748b;
        user-select: none;
      }

      .q-square.active {
        background-color: var(--brand-primary) !important;
        color: white !important;
        border-color: var(--brand-primary) !important;
        box-shadow: 0 4px 12px rgba(155, 17, 30, 0.3);
        transform: translateY(-2px);
      }

      .q-square.answered {
        background-color: #fff1f2;
        color: #9b111e;
        border-color: #fecdd3;
      }

      .q-square:hover:not(.active) {
        border-color: var(--brand-primary);
        color: var(--brand-primary);
        background: #fff1f2;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .math-inline { display: inline-flex; align-items: center; font-weight: 700; color: inherit; }
      .katex { font-size: 1.1em; color: inherit; }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
      
      .sidebar-portal {
        scrollbar-width: thin;
        scrollbar-color: #fecdd3 transparent;
      }
      .sidebar-portal::-webkit-scrollbar { width: 4px; }
      .sidebar-portal::-webkit-scrollbar-thumb { background: #fecdd3; border-radius: 10px; }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
